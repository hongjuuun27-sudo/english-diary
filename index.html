<!-- 영어일기 — 화면과 동작. 주제·질문은 data/topics.js (규칙은 CLAUDE.md) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-ZkPhm/XIG0OfmacgETrxegJVz1EaAsguMgwEdMCZzuk='; style-src 'unsafe-inline'; connect-src 'self' https://api.elevenlabs.io; media-src blob:; img-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<title>영어일기</title>
<!-- 웹앱 설치(5단계): 같은 폴더의 manifest·아이콘·sw.js — 없어도 앱은 그대로 동작 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#121417;
    --bg-2:#1A1D21;
    --bg-3:#23272D;
    --text:#ECE9E4;
    --text-2:#C9CBCF;
    --muted:#A1A7B0;
    --faint:#8C939C;
    --line:rgba(255,255,255,.08);
    --card:#1F2328;
    --accent:#86C2AC;
    --accent-soft:rgba(134,194,172,.11);
    --accent-line:rgba(134,194,172,.42);
    --on-accent:#10201B;
    --warn:#E8A57A;
    --warn-soft:rgba(232,165,122,.12);
    --mark:rgba(134,194,172,.26);
    --scrim:rgba(0,0,0,.58);
    --toast:#2B3036;
    --pad:20px;
    --tabbar-h:58px;
    --tz:1;               /* 글자 크기(설정) — applyTextZoom이 바꿈 */
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F5F3EE;
      --bg-2:#ECE9E2;
      --bg-3:#F0EDE6;
      --text:#1F2226;
      --text-2:#3B3F45;
      --muted:#5E646C;
      --faint:#5F646B;
      --line:rgba(0,0,0,.08);
      --card:#FFFFFF;
      --accent:#256A55;
      --accent-soft:rgba(37,106,85,.07);
      --accent-line:rgba(37,106,85,.36);
      --on-accent:#FFFFFF;
      --warn:#9A4A15;
      --warn-soft:rgba(154,74,21,.08);
      --mark:rgba(37,106,85,.16);
      --scrim:rgba(20,22,25,.34);
    }
  }
  @media (max-width:370px){ :root{ --pad:18px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px; line-height:1.55; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  button:focus{ outline:none; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  button:disabled{ cursor:default; opacity:.45; }
  svg{ display:block; }
  textarea, input{ font:inherit; color:var(--text); }
  textarea::placeholder, input::placeholder{ color:var(--faint); }

  /* ---------- 앱 틀: 화면 + 하단 탭 3개 ---------- */
  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; }
  .views{ position:relative; flex:1; min-height:0; }
  .view{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; }
  .view.off{ visibility:hidden; pointer-events:none; }
  .page{ padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 32px max(var(--pad), env(safe-area-inset-left)); }
  .tabbar{
    position:relative; z-index:15; flex:none; display:flex;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    padding:0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background:var(--bg); border-top:1px solid var(--line);
  }
  .tab{ flex:1; min-width:0; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12px; font-weight:600; color:var(--faint); }
  .tab-ico{ position:relative; z-index:0; display:block; width:23px; height:23px; }
  .tab-ico svg{ width:23px; height:23px; }
  .tab-ico::before{ content:""; position:absolute; z-index:-1; top:-4px; bottom:-4px; left:-17px; right:-17px; border-radius:999px; background:var(--accent); opacity:0; transform:scaleX(.6); transition:opacity .2s ease, transform .2s ease; }
  .tab[aria-selected="true"]{ color:var(--text); font-weight:750; }
  .tab[aria-selected="true"] .tab-ico{ color:var(--accent); }
  .tab[aria-selected="true"] .tab-ico::before{ opacity:.2; transform:none; }

  .head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .head h1{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em; }
  .head .sub{ font-size:13.5px; color:var(--faint); font-weight:600; font-variant-numeric:tabular-nums; }
  .sec-t{ margin:22px 2px 10px; font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--faint); }
  .note{ margin:8px 2px 0; font-size:13.5px; line-height:1.6; color:var(--faint); }

  /* 큰 버튼(화면마다 하나) · 보조 버튼 */
  .go{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:56px; padding:12px 18px; border-radius:16px; background:var(--accent); color:var(--on-accent); font-size:17.5px; font-weight:750; text-align:center; }
  .go svg{ width:20px; height:20px; flex:none; }
  .go:active{ transform:scale(.985); }
  .sub-btn{ display:flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:8px 14px; border-radius:12px; font-size:15px; font-weight:600; color:var(--accent); }
  .sub-btn svg{ width:17px; height:17px; }
  .sub-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px 10px; margin-top:8px; }
  .seg{ display:flex; gap:3px; padding:3px; border-radius:13px; background:var(--bg-2); border:1px solid var(--line); }
  .seg button{ flex:1; min-height:44px; border-radius:10px; font-size:15.5px; color:var(--muted); }
  .seg button[aria-pressed="true"]{ background:var(--card); color:var(--text); font-weight:650; box-shadow:0 1px 3px rgba(0,0,0,.18); }

  /* ---------- 이번 주: 주제 고르기 ---------- */
  .tp-list{ display:flex; flex-direction:column; gap:10px; }
  .tp{ display:flex; gap:14px; align-items:flex-start; width:100%; padding:16px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); text-align:left; }
  .tp[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .tp-emo{ flex:none; font-size:28px; line-height:1.1; }
  .tp-body{ flex:1; min-width:0; }
  .tp-ko{ display:block; font-size:18px; font-weight:750; }
  .tp-en{ display:block; font-size:14px; color:var(--muted); }
  .tp-ex{ display:block; margin-top:8px; font-size:13.5px; line-height:1.5; color:var(--faint); }
  .tp-chk{ flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--faint); display:flex; align-items:center; justify-content:center; }
  .tp[aria-pressed="true"] .tp-chk{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .tp-chk svg{ width:15px; height:15px; opacity:0; }
  .tp[aria-pressed="true"] .tp-chk svg{ opacity:1; }
  .start-foot{ margin-top:22px; }

  /* ---------- 이번 주: 타임라인 ---------- */
  .wk-topic{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px; background:var(--bg-2); }
  .wk-topic .tp-emo{ font-size:26px; }
  .wk-prog{ margin-left:auto; flex:none; font-size:13.5px; font-weight:650; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .now-card{ margin-top:14px; padding:16px; border-radius:18px; background:var(--accent-soft); border:1px solid var(--accent-line); }
  .now-k{ font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--accent); }
  .now-t{ margin:4px 0 14px; font-size:18px; font-weight:700; line-height:1.45; }
  .now-s{ display:block; margin-top:2px; font-size:14px; font-weight:500; color:var(--muted); }
  .tl{ list-style:none; margin:0; padding:0; position:relative; }
  .tl li{ position:relative; display:flex; gap:12px; align-items:flex-start; padding:4px 0; }
  .tl li:not(:last-child)::before{ content:""; position:absolute; left:17px; top:42px; bottom:-6px; width:2px; background:var(--line); }
  .tl-dot{ flex:none; position:relative; z-index:1; width:36px; height:36px; margin-top:6px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:750; background:var(--bg-2); border:1.5px solid var(--line); color:var(--muted); font-variant-numeric:tabular-nums; }
  .tl-dot svg{ width:18px; height:18px; }
  .tl li.done .tl-dot{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .tl li.cur .tl-dot{ border-color:var(--accent); color:var(--accent); border-width:2px; }
  .tl-main{ flex:1; min-width:0; display:block; width:100%; padding:10px 12px; border-radius:14px; text-align:left; }
  .tl-main:active{ background:var(--bg-2); }
  .tl-k{ display:block; font-size:12.5px; font-weight:700; color:var(--faint); letter-spacing:.02em; }
  .tl li.done .tl-k{ color:var(--accent); }
  .tl-t{ display:block; margin-top:2px; font-size:16px; font-weight:650; line-height:1.45; }
  .tl-e{ display:block; margin-top:2px; font-size:13.5px; color:var(--muted); line-height:1.45; }
  .tl-side{ flex:none; display:flex; flex-direction:column; align-items:center; padding-top:4px; }
  .tl-btn{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .tl-btn svg{ width:20px; height:20px; }
  .tl-btn:active{ background:var(--bg-2); }
  .tl li.gpt .tl-dot{ font-size:11px; letter-spacing:-.02em; }
  .tl li.off .tl-main{ cursor:default; }
  .tl li.off .tl-t{ color:var(--muted); }
  .lv{ display:inline-block; margin-left:6px; padding:0 7px; border-radius:6px; font-size:11.5px; font-weight:700; background:var(--bg-3); color:var(--muted); vertical-align:1px; }

  /* ---------- 질문 진행 · GPT 대화 (전체 화면) ---------- */
  .full{ position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--bg); }
  .full[hidden]{ display:none; }
  .f-top{ flex:none; display:flex; align-items:center; gap:6px; padding:calc(env(safe-area-inset-top, 0px) + 6px) max(10px, env(safe-area-inset-right)) 4px max(6px, env(safe-area-inset-left)); }
  .f-x{ flex:none; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .f-x svg{ width:22px; height:22px; }
  .f-title{ flex:1; min-width:0; font-size:15px; font-weight:700; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .steps{ flex:none; display:flex; gap:4px; padding:0 max(var(--pad), env(safe-area-inset-right)) 4px max(var(--pad), env(safe-area-inset-left));   /* 칩을 44px로 키운 만큼 바깥 여백을 줄임(5-2) */ }
  .st{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; min-height:44px; justify-content:center; padding:4px 0; font-size:12px; font-weight:650; color:var(--faint); }
  .st::before{ content:""; display:block; width:100%; height:4px; border-radius:2px; background:var(--bg-3); }
  .st.reached::before{ background:var(--accent-line); }
  .st.reached{ color:var(--muted); }
  .st.cur{ color:var(--text); font-weight:800; }
  .st.cur::before{ background:var(--accent); }
  .st:disabled{ opacity:1; }
  .f-body{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:10px max(var(--pad), env(safe-area-inset-right)) 24px max(var(--pad), env(safe-area-inset-left)); }
  .f-foot{ flex:none; padding:10px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(var(--pad), env(safe-area-inset-left)); border-top:1px solid var(--line); background:var(--bg); }
  .f-foot .sub-row{ margin-top:4px; }

  .q-en{ margin:4px 0 0; font-size:21px; font-weight:750; line-height:1.4; }
  .q-ko{ margin:6px 0 0; font-size:15px; color:var(--muted); }
  .wr{ display:block; width:100%; min-height:200px; margin-top:18px; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--card); font-size:17px; line-height:1.6; resize:vertical; }
  .wr:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .wc{ margin:6px 2px 0; font-size:13px; color:var(--faint); text-align:right; font-variant-numeric:tabular-nums; }
  .how{ margin:4px 0 0; padding:0; list-style:none; counter-reset:how; }
  .how li{ position:relative; padding:10px 0 10px 40px; font-size:15.5px; line-height:1.55; color:var(--text-2); counter-increment:how; }
  .how li::before{ content:counter(how); position:absolute; left:0; top:9px; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:750; background:var(--bg-3); color:var(--muted); }
  .how li.on::before{ background:var(--accent); color:var(--on-accent); }
  .how li.ok::before{ content:"✓"; background:var(--accent-soft); color:var(--accent); }
  .how b{ color:var(--text); }
  .box{ margin-top:14px; padding:14px; border-radius:14px; background:var(--bg-2); }
  .box-t{ margin:0 0 6px; font-size:13px; font-weight:700; letter-spacing:.03em; color:var(--faint); }
  .warn{ margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--warn-soft); color:var(--warn); font-size:14.5px; line-height:1.55; }
  .warn b{ font-weight:750; }
  .man{ display:block; width:100%; min-height:90px; margin-top:8px; padding:12px; border-radius:12px; border:1px dashed var(--faint); background:transparent; font-size:14.5px; line-height:1.5; resize:vertical; }
  details.more{ margin-top:16px; }
  details.more summary{ min-height:44px; display:flex; align-items:center; gap:6px; font-size:14.5px; font-weight:600; color:var(--muted); cursor:pointer; list-style:none; }
  details.more summary::-webkit-details-marker{ display:none; }
  details.more summary::before{ content:"›"; display:inline-block; width:14px; font-size:18px; transition:transform .15s ease; }
  details.more[open] summary::before{ transform:rotate(90deg); }
  .pre{ margin:4px 0 0; padding:12px; border-radius:12px; background:var(--bg-2); font-size:13px; line-height:1.55; color:var(--text-2); white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto; }

  /* 문장 짝 */
  .pairs{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .pair{ display:flex; gap:10px; padding:12px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .pair.bad{ border-color:var(--warn); }
  .pn{ flex:none; width:24px; font-size:14px; font-weight:750; color:var(--faint); padding-top:2px; font-variant-numeric:tabular-nums; }
  .pb{ flex:1; min-width:0; }
  .pe{ font-size:16.5px; font-weight:600; line-height:1.5; }
  .pe.none{ color:var(--warn); font-weight:600; font-size:14px; }
  .pk{ display:block; width:100%; margin-top:6px; min-height:44px; padding:10px 10px; border-radius:9px; border:1px solid transparent; background:var(--bg-2); font-size:15px; line-height:1.5; color:var(--text-2); resize:none; overflow:hidden; }
  .pk:focus{ outline:none; border-color:var(--accent-line); background:var(--bg-3); }
  .pk.empty{ border-color:var(--warn); }
  .pko{ margin-top:4px; font-size:14.5px; color:var(--muted); line-height:1.5; }
  .flow{ font-size:16px; line-height:1.6; font-weight:600; }
  .kw{ display:flex; flex-wrap:wrap; gap:6px; }
  .kw span{ padding:3px 10px; border-radius:999px; background:var(--bg-3); font-size:14px; }
  .conds{ margin:0; padding-left:20px; font-size:15px; line-height:1.6; color:var(--text-2); }
  .todo{ margin-top:14px; padding:14px; border-radius:14px; border:1px dashed var(--faint); font-size:14.5px; color:var(--muted); line-height:1.55; }
  .big-flow{ margin-top:12px; padding:18px 16px; border-radius:16px; background:var(--accent-soft); border:1px solid var(--accent-line); font-size:19px; font-weight:650; line-height:1.6; }
  .donebox{ margin-top:6px; text-align:center; }
  .donebox .em{ font-size:44px; }
  .donebox h2{ margin:4px 0 4px; font-size:22px; }
  .donebox p{ margin:0; color:var(--muted); font-size:15px; }

  /* ---------- 기록 ---------- */
  .lg{ margin-top:10px; border-radius:16px; background:var(--card); border:1px solid var(--line); overflow:hidden; }
  .lg-h{ display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:12px 14px; text-align:left; }
  .lg-h .tp-emo{ font-size:24px; }
  .lg-t{ flex:1; min-width:0; }
  .lg-t b{ display:block; font-size:16px; }
  .lg-t span{ display:block; font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .lg-b{ padding:0 14px 14px; }
  .lg-q{ margin-top:12px; }
  .lg-q h3{ margin:0; font-size:15px; font-weight:700; line-height:1.45; }
  .lg-q .st-l{ font-size:12.5px; color:var(--faint); font-weight:600; }
  .lg-q p{ margin:6px 0 0; font-size:15px; line-height:1.55; color:var(--text-2); }
  .empty-t{ margin:40px 0; text-align:center; color:var(--faint); font-size:15px; line-height:1.7; }

  /* ---------- 노래방 강조 (한 장 영어와 같음): .sc(문장) > .w(단어). 재생하면 문장이 흐려지고 읽은 단어·지금 단어가 채워짐.
     굵기는 안 바꾸고 밝기 + text-shadow로만(단어 폭·줄바꿈이 그대로). 단어 신호가 없으면 .lineonly(문장 전체에 은은한 배경) ---------- */
  .sc .w, .sc .gloss{ transition:opacity .22s ease, text-shadow .22s ease; }
  .sc .w{ cursor:pointer; }
  .sc.reading .w, .sc.reading .gloss{ opacity:.35; }
  .sc.reading .w.past, .sc.reading .w.now, .sc.reading.filled .w{ opacity:1; text-shadow:.3px 0 currentColor, -.3px 0 currentColor; }
  .sc.reading.lineonly .w, .sc.reading.lineonly .gloss{ opacity:1; }
  .sc.reading.lineonly{ background:var(--mark); box-shadow:0 0 0 2px var(--mark); border-radius:4px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .gloss{ color:var(--muted); font-size:.9em; }
  /* 누른 단어(듣기 단계 · 듣기 탭 끊지 않고 듣기): 잠깐 배경이 켜졌다 사라짐 — 눌렸다는 표시 */
  .sc .w.tapped{ opacity:1; border-radius:4px; animation:wTap .8s ease-out; }
  @keyframes wTap{ 0%, 40%{ background:var(--mark); box-shadow:0 0 0 3px var(--mark); } 100%{ background:transparent; box-shadow:0 0 0 3px transparent; } }

  /* ---------- 듣기 단계 ---------- */
  .ls-bar{ display:flex; align-items:center; gap:10px; margin-top:18px; }
  .ls-play{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; min-height:48px; padding:0 14px; border-radius:14px; border:1.5px solid var(--accent-line); background:var(--accent-soft); color:var(--accent); font-size:16px; font-weight:700; }
  .ls-play svg{ width:18px; height:18px; }
  .rate-seg{ flex:none; }
  .rate-seg button{ min-width:46px; min-height:44px; font-size:14px; padding:0 3px; }
  .ls-row{ align-items:flex-start; transition:border-color .2s ease, background .2s ease; }
  .ls-row.cur{ border-color:var(--accent); background:var(--accent-soft); }
  .ls-row .pe{ font-size:18px; font-weight:600; }

<script>
"use strict";
/* =====================================================================
   영어일기 — 1단계: 이번 주(주제 고르기·타임라인) · 질문 진행(쓰기·첨삭) · GPT 대화 · 기록
   저장 키는 모두 "ediary." (한 장 영어 "engcards."와 겹치지 않게)
   ===================================================================== */

/* ---------- 데이터 ---------- */
const TOPICS = Array.isArray(window.TOPIC_DATA) ? window.TOPIC_DATA : [];
const TOPIC_BY_ID = {}, Q_BY_ID = {};
TOPICS.forEach(t => {
  TOPIC_BY_ID[t.id] = t;
  (t.questions || []).forEach(q => { Q_BY_ID[q.id] = Object.assign({ topic: t.id }, q); });
});
const LEVEL_NAME = { 1: "쉬움", 2: "중간", 3: "깊음" };
const PICK_PLAN = { 3: [1, 1, 1], 4: [1, 2, 1], 5: [2, 2, 1] };   // 질문 개수 → 쉬움·중간·깊음
const STEPS = ["write", "fix", "listen", "recite", "speak", "done"];
const STEP_NAME = ["쓰기", "첨삭", "듣기", "암송", "말하기"];
const RECOMMEND_N = 5;
const HANGUL_RE = /[가-힣]/;

/* ---------- 앱의 '지금'과 '오늘' (하루는 자정 기준, 한 주는 월요일 0시 ~ 일요일 밤 12시) ----------
   테스트용: ?debugDate=2026-10-20 (그 날 낮 12시) 또는 ?debugDate=2026-10-20T23:59 */
const DEBUG_T0 = (() => {
  try {
    const v = new URLSearchParams(location.search).get("debugDate") || "";
    const m = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/.exec(v.trim());
    if (!m) return null;
    const t = new Date(+m[1], +m[2] - 1, +m[3], m[4] != null ? +m[4] : 12, m[5] != null ? +m[5] : 0, m[6] != null ? +m[6] : 0);
    return isNaN(t) ? null : { at: t.getTime(), real: Date.now() };
  } catch (e) { return null; }
})();
function appNow() { return DEBUG_T0 ? new Date(DEBUG_T0.at + (Date.now() - DEBUG_T0.real)) : new Date(); }
const pad2 = n => String(n).padStart(2, "0");
function dateKey(d) { d = d || appNow(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function keyDate(k) { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(k, n) { const d = keyDate(k); d.setDate(d.getDate() + n); return dateKey(d); }
function weekKey(d) { d = d || appNow(); const k = dateKey(d); return addDays(k, -((d.getDay() + 6) % 7)); }   // 그 주 월요일
function md(k) { const d = keyDate(k); return (d.getMonth() + 1) + "월 " + d.getDate() + "일"; }
function weekRange(wk) {
  const a = keyDate(wk), b = keyDate(addDays(wk, 6));
  return md(wk) + " ~ " + (a.getMonth() === b.getMonth() ? b.getDate() + "일" : md(addDays(wk, 6)));
}

/* =====================================================================
   인터랙티브 스크립트 ① 글 준비·그리기 (한 장 영어에서 가져옴 — 밑줄·연음 표시는 뺌)
   getScript(text) → { id, text(화면 글), speech(읽을 글 — 괄호 속 한국어 뜻은 뺌), words: [{ pieces, ss, se }], wordAt(읽을 글 위치) }
   scriptHtml(text) → <span class="sc" data-sc="id"> 안에 단어마다 <span class="w" data-w="번호">
   ===================================================================== */
const SCRIPTS = [];
const SCRIPT_BY_TEXT = new Map();
const GLOSS_RE = /\s*\([^()]*[가-힣ㄱ-ㅎㅏ-ㅣ][^()]*\)/g;
function getScript(text) {
  text = String(text || "");
  if (SCRIPT_BY_TEXT.has(text)) return SCRIPT_BY_TEXT.get(text);
  const n = text.length;
  const gloss = new Uint8Array(n);
  GLOSS_RE.lastIndex = 0;
  let m;
  while ((m = GLOSS_RE.exec(text))) for (let i = m.index; i < m.index + m[0].length; i++) gloss[i] = 1;
  const d2s = new Int32Array(n);
  let speech = "";
  for (let i = 0; i < n; i++) {
    if (gloss[i]) { d2s[i] = -1; continue; }
    d2s[i] = speech.length;
    speech += text[i];
  }
  const toks = [];
  let cur = null;
  for (let i = 0; i < n; i++) {
    if (gloss[i] || /\s/.test(text[i])) { cur = null; continue; }
    if (cur) cur.e = i + 1;
    else { cur = { s: i, e: i + 1 }; toks.push(cur); }
  }
  const words = [];
  let lead = [];
  toks.forEach(t => {
    const p = [t.s, t.e];
    if (/[A-Za-z0-9]/.test(text.slice(t.s, t.e))) { words.push({ pieces: lead.concat([p]) }); lead = []; }
    else if (words.length) words[words.length - 1].pieces.push(p);
    else lead.push(p);
  });
  if (lead.length) words.push({ pieces: lead });
  const wAt = new Int32Array(n).fill(-1);
  const sp2w = new Int32Array(speech.length).fill(-1);
  words.forEach((w, k) => {
    w.pieces.forEach(p => { for (let i = p[0]; i < p[1]; i++) { wAt[i] = k; if (d2s[i] >= 0) sp2w[d2s[i]] = k; } });
    w.ss = d2s[w.pieces[0][0]];
    w.se = d2s[w.pieces[w.pieces.length - 1][1] - 1] + 1;
  });
  for (let i = 1; i < sp2w.length; i++) if (sp2w[i] < 0) sp2w[i] = sp2w[i - 1];
  const sc = {
    id: SCRIPTS.length, text, speech, words, wAt, gloss,
    wordAt: i => (i >= 0 && i < sp2w.length ? Math.max(0, sp2w[i]) : (i >= sp2w.length ? words.length - 1 : 0))
  };
  SCRIPTS.push(sc);
  SCRIPT_BY_TEXT.set(text, sc);
  return sc;
}
function scriptHtml(text) {
  const sc = getScript(text);
  const t = sc.text, n = t.length;
  let html = '<span class="sc" data-sc="' + sc.id + '">';
  let curW = -1, curG = 0;
  const closeIn = () => { if (curW >= 0 || curG) html += "</span>"; curW = -1; curG = 0; };
  for (let i = 0; i < n; i++) {
    const w = sc.wAt[i], g = sc.gloss[i];
    if (w !== curW || g !== curG) {
      closeIn();
      if (g) { html += '<span class="gloss">'; curG = 1; }
      else if (w >= 0) { html += '<span class="w" data-w="' + w + '">'; curW = w; }
    }
    html += esc(t[i]);
  }
  closeIn();
  return html + "</span>";
}

/* =====================================================================
   음성 캐시 (한 번 만든 ElevenLabs 음성은 폰에 저장해서 재사용 — 크레딧은 처음 한 번만)
   IndexedDB "ediary-tts"(한 장 영어 "engcards-tts"와 따로), 키 = 모델|목소리|읽을 글, 값 = { audio: mp3 Blob, align: 글자별 시간 }
   ===================================================================== */
const AudioCache = (() => {
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise(res => {
        const giveUp = setTimeout(() => res(null), 1500);   // 저장소가 답이 없으면(일부 비밀 모드·file:// 등) 저장 없이 재생
        try {
          const r = indexedDB.open("ediary-tts", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("audio");
          r.onsuccess = () => { clearTimeout(giveUp); res(r.result); };
          r.onerror = () => { clearTimeout(giveUp); res(null); };
        } catch (e) { clearTimeout(giveUp); res(null); }
      });
    }
    return dbp;
  }
  async function get(k) {
    if (mem.has(k)) return mem.get(k);
    const d = await db();
    if (!d) return null;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => { const b = q.result || null; if (b) mem.set(k, b); res(b); };
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function put(k, clip) {
    mem.set(k, clip);
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").put(clip, k); } catch (e) {}
  }
  async function clear() {
    mem.clear();
    const d = await db();
    if (!d) return;
    try { d.transaction("audio", "readwrite").objectStore("audio").clear(); } catch (e) {}
  }
  async function has(k) {
    const m = mem.get(k);
    if (m) return m.audio instanceof Blob;
    const d = await db();
    if (!d) return false;
    return new Promise(res => {
      try {
        const q = d.transaction("audio").objectStore("audio").get(k);
        q.onsuccess = () => res(!!(q.result && q.result.audio instanceof Blob));
        q.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  return { get, put, clear, has };
})();

/* =====================================================================
   음성 재생 Player (한 장 영어에서 가져옴 — 미리 만든 음성·구간 자르기는 뺌)
   모든 소리는 여기를 거침: play(지금 것 끊고) / enqueue(이어서) / pause / resume / stop / setRate / seekWord
   순서: 폰에 저장된 음성 → 키가 있으면 ElevenLabs로 만들기 → 폰 기본 음성(en-US)
   음성은 audio 요소 하나로만 냄(Web Audio를 거치지 않음 — 음질 원칙, 한 장 영어 CLAUDE.md '음성 재생 경로 원칙')
   ===================================================================== */
const Player = (() => {

    } catch (e) { deviceVoice = null; }
  }
  try { if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); } } catch (e) {}
  function mark(btn, on) { if (btn) btn.classList.toggle("playing", on); }
  const subs = [];

  function emit() { subs.forEach(fn => { try { fn(); } catch (e) {} }); }

  let paused = false, resumeFn = null, audioCtl = null, speechCtl = null, lastLen = 0, selfPause = false;

      if (speechCtl) speechCtl.halt();

    emit();

    if (selfPause) { selfPause = false; return; }
    if (audioCtl && !paused && !audio.ended) interrupted();
  });

    token++;
    paused = false; resumeFn = null;
    quietPause();
    if (audioCtl) audioCtl.finish();
    if (speechCtl) { speechCtl.halt(); speechCtl.finish(); }
    mark(currentBtn, false); currentBtn = null;
    queue = Promise.resolve();
    emit();
  }

    if (paused) return;
    paused = true;
    if (audioCtl && !audio.paused) {
      quietPause();
      const ctl = audioCtl;
      resumeFn = () => { const p = audio.play(); if (p && p.catch) p.catch(ctl.finish); };
    } else if (speechCtl) { speechCtl.halt(); resumeFn = speechCtl.restart; }
    emit();
  }

    if (!paused) return;
    paused = false;
    const f = resumeFn; resumeFn = null;
    if (f) f();

    o = o || {};

      const url = URL.createObjectURL(blob);

      const tick = () => {

          const k = wordAtTime(o.times, audio.currentTime);
          if (k >= 0 && k !== last) { last = k; o.track.word(k); }
        }

/* 같은 단계의 다른 질문으로 바꾸기(아직 안 쓴 질문만). 한 번 뺀 질문은 다른 질문을 다 써 본 뒤에야 다시 나옴 */

/* =====================================================================

const SEC_NAME = { "최종본": "final", "최종": "final", "흐름": "flow", "한국어 흐름": "flow", "키워드": "kw", "영어 키워드": "kw", "조건": "cond", "조건 바꿔 말하기": "cond" };

    let line = cleanLine(src);

    const s = sectionOf(line);

/* ---------- 문단 (듣기 탭 '끊지 않고 듣기') ----------
   최종본 문장들을 문단으로 묶음. 문단 구분 = 내가 쓴 원래 글(it.text)의 빈 줄.
   원래 글의 문단마다 단어 집합을 만들고, 최종본 문장을 순서대로(앞 문단 → 뒤 문단, 문단마다 1문장 이상) 가장 잘 맞는 문단에 붙임.

   paraList(it) → [{ en: 문단 영어(문장을 띄어쓰기로 이음), ko: 문단 한국어, idx: [문장 번호] }] — 문장 번호 = 영어가 있는 짝의 순서 */
const PARA_MATCH = 0.5;
const enWords = s => String(s || "").toLowerCase().match(/[a-z][a-z']*/g) || [];
function paraGroups(it) {
  const ps = (it.pairs || []).filter(p => p.en), n = ps.length;

  const paras = String(it.text || "").split(/\n[ \t　]*\n/).map(s => s.trim()).filter(s => enWords(s).length);
  const P = paras.length;
  if (P < 2 || P > n) return one;
  const sets = paras.map(p => new Set(enWords(p)));
  const df = new Map();
  sets.forEach(s => s.forEach(w => df.set(w, (df.get(w) || 0) + 1)));
  const ws = ps.map(p => enWords(p.en));
  /* 점수 = 그 문단에만 있는 단어일수록 크게(여러 문단에 다 있는 단어는 1/문단 수) */
  const score = ws.map(list => sets.map(s => list.length ? list.reduce((a, w) => a + (s.has(w) ? 1 / df.get(w) : 0), 0) / list.length : 0));
  const NEG = -1e9, dp = ws.map(() => new Array(P).fill(NEG)), from = ws.map(() => new Array(P).fill(0));
  dp[0][0] = score[0][0];
  for (let i = 1; i < n; i++) for (let p = 0; p < P; p++) {
    const stay = dp[i - 1][p], step = p ? dp[i - 1][p - 1] : NEG;
    if (stay === NEG && step === NEG) continue;
    dp[i][p] = score[i][p] + Math.max(stay, step);
    from[i][p] = step > stay ? p - 1 : p;
  }
  if (dp[n - 1][P - 1] === NEG) return one;
  const at = new Array(n);
  for (let i = n - 1, p = P - 1; i >= 0; i--) { at[i] = p; p = from[i][p]; }
  const hit = ws.reduce((a, list, i) => a + (list.length ? list.filter(w => sets[at[i]].has(w)).length / list.length : 1), 0) / n;
  if (hit < PARA_MATCH) return one;                                          // 맞추기 어려우면 한 문단
  const groups = [];
  at.forEach((p, i) => { (groups[p] = groups[p] || []).push(i); });
  return groups;
}

  const ps = (it.pairs || []).filter(p => p.en);

    en: idx.map(i => ps[i].en.trim()).join(" "),
    ko: idx.map(i => (ps[i].ko || "").trim()).filter(Boolean).join(" "),

    (WK.pick ? esc(TOPIC_BY_ID[WK.pick].ko) + "(으)로 이번 주 시작" : "주제를 골라 주세요") + "</button></div>";
  return h;
}
function entryTitle(w, e) {
  if (e.kind === "q") return "질문 " + e.n;

  return "주말 복습";
}
function qStatus(w, qid) {
  const it = w.items[qid];
  if (!it || !qStarted(w, qid)) return "아직 안 함";
  if (it.step === "done") return "완료";
  return STEP_NAME[stepIdx(it)] + " 단계";
}
function weekHtml(w) {

  const tl = timeline(w);
  const nq = w.qs.filter(q => qDone(w, q)).length, ng = w.gpt.filter(g => g.done).length;
  const nx = nextEntry(w);
  let h = '<div class="wk-topic"><span class="tp-emo" aria-hidden="true">' + t.emoji + '</span><span><b style="display:block;font-size:17px">' + esc(t.ko) +
    '</b><span style="font-size:13.5px;color:var(--muted)">' + esc(t.en) + '</span></span><span class="wk-prog">질문 ' + nq + "/" + w.qs.length + "<br>GPT " + ng + "/" + w.gpt.length + "</span></div>";
  // 지금 할 일
  h += '<div class="now-card"><div class="now-k">지금 할 일</div>';

    h += '<div class="now-t">' + esc(q.ko) + '<span class="now-s">질문 ' + nx.n + " · " + (qStarted(w, nx.qid) ? STEP_NAME[stepIdx(it)] + " 단계부터 이어서" : "쓰기부터") + "</span></div>" +
      '<button class="go" data-open-q="' + nx.qid + '">' + (qStarted(w, nx.qid) ? "이어서 하기" : "질문 " + nx.n + " 시작") + IC.arrow + "</button>";
  } else if (nx && nx.kind === "gpt") {
    h += '<div class="now-t">GPT와 20~30분 영어로 대화하기<span class="now-s">GPT 대화 ' + nx.n + " · 지금까지 쓴 글로 질문해 줘요</span></div>" +
      '<button class="go" data-open-g="' + nx.g.id + '">GPT 대화 준비' + IC.arrow + "</button>";

    h += '<div class="now-t">주말 복습<span class="now-s">이번 주 문장 섞어서 말하기 → 질문마다 조건 바꿔 말하기</span></div>' +
      '<button class="go" data-open-review>' + (started ? "이어서 복습" : "주말 복습 시작") + IC.arrow + "</button>";
  } else if (w.review && w.review.doneOn) {
    h += '<div class="now-t">이번 주를 다 끝냈어요 🎉<span class="now-s">다음 주 월요일에 새 주제를 골라요</span></div>';
  } else {
    h += '<div class="now-t">이번 주 질문과 GPT 대화를 다 했어요 🎉<span class="now-s">주말 복습은 일요일(' + md(reviewDay(w)) + ")에 열려요</span></div>";

    const cur = !!nx && nx.kind === e.kind && (e.kind === "q" ? nx.qid === e.qid : e.kind === "gpt" ? nx.g.id === e.g.id : true);   // 지금 할 일과 같은 항목
    if (e.kind === "q") {

        '<button class="tl-main" data-open-q="' + e.qid + '"><span class="tl-k">' + entryTitle(w, e) + " · " + qStatus(w, e.qid) + '<span class="lv">' + LEVEL_NAME[q.level] + "</span></span>" +
        '<span class="tl-t">' + esc(q.ko) + '</span><span class="tl-e">' + esc(q.en) + "</span></button>" +
        (canSwap ? '<span class="tl-side"><button class="tl-btn" data-swap="' + e.qid + '" aria-label="같은 단계의 다른 질문으로 바꾸기">' + IC.swap + "</button></span>" : "") + "</li>";

  if (!anyStarted) h += '<div class="sub-row"><button class="sub-btn" data-retopic>주제 다시 고르기</button></div>';

}
$("weekPage").addEventListener("click", e => {
  const t = e.target;
  let b;
  if ((b = t.closest("[data-pick]"))) { WK.pick = b.dataset.pick; buzz(); renderWeek(); return; }
  if ((b = t.closest("[data-count]"))) { WK.count = +b.dataset.count; buzz(); renderWeek(); return; }
  if ((b = t.closest("[data-start]"))) {
    if (!WK.pick) return;
    startWeek(WK.pick, WK.count); buzz(); renderWeek(); $("vWeek").scrollTop = 0;
    toast("이번 주 주제를 정했어요");
    return;
  }
  const w = curWeek();
  if (!w) return;
  if ((b = t.closest("[data-swap]"))) { if (swapQuestion(w, b.dataset.swap)) { buzz(); toast("다른 질문으로 바꿨어요"); renderWeek(); } return; }
  if ((b = t.closest("[data-gmove]"))) { const [id, d] = b.dataset.gmove.split(":"); moveGpt(w, id, +d); renderWeek(); return; }
  if ((b = t.closest("[data-open-q]"))) { openQuestion(b.dataset.openQ); return; }
  if ((b = t.closest("[data-open-g]"))) { openGpt(b.dataset.openG); return; }
  if ((b = t.closest("[data-open-review]"))) { openReview(); return; }
  if ((b = t.closest("[data-retopic]"))) {

  }
});

/* =====================================================================
   질문 진행 화면 (쓰기 → 첨삭 → 듣기 → 암송 → 말하기 → 완료)
   F.view = 보고 있는 단계(지난 단계도 다시 볼 수 있음), 진행은 항목의 step(가장 멀리 간 단계)
   ===================================================================== */
const F = { open: false, kind: null, wk: null, qid: null, gid: null, view: 0, rd: null, rcShown: false, rcAuto: false, rcQ: null, tm: null, tmTimer: 0 };
const FL = { el: $("flow"), title: $("flowTitle"), steps: $("flowSteps"), body: $("flowBody"), foot: $("flowFoot") };
function fWeek() { return store.weeks[F.wk] || null; }
function showFlow() {
  if (!F.open) { F.open = true; history.pushState({ flow: 1 }, ""); }
  FL.el.hidden = false;
  $("app").inert = true;
}
function hideFlow() {
  Player.stop();
  F.rd = null;
  clearInterval(F.tmTimer);
  F.tm = null;
  F.rcShown = false;
  if (saveTimer) { clearTimeout(saveTimer); save(); }
  F.open = false;
  FL.el.hidden = true;
  $("app").inert = false;
  if (tab === "week") renderWeek();
  if (tab === "log") renderLog();
}
function closeFlow() { if (F.open && history.state && history.state.flow) history.back(); else hideFlow(); }
$("flowX").addEventListener("click", closeFlow);
addEventListener("popstate", () => { if (ST.open) stHide(); else if (F.open) hideFlow(); else if (DV.open) dvHide(); });
addEventListener("keydown", e => { if (e.key !== "Escape") return; if (ST.open) closeSettings(); else if (F.open) closeFlow(); else if (DV.open) closeDrive(); });

function openQuestion(qid) {
  const w = curWeek();
  if (!w || !Q_BY_ID[qid]) return;
  Object.assign(F, { kind: "q", wk: weekKey(), qid, gid: null });
  enterQuestion(w, qid);
  showFlow();
  renderFlow();
  FL.body.scrollTop = 0;
}
function advance(it, v) {
  const nx = v + 1;
  if (nx > stepIdx(it)) it.step = STEPS[nx];
  if (it.step === "done" && !it.doneOn) it.doneOn = dateKey();
  F.view = nx;
  save();
  buzz();
  renderFlow();
  FL.body.scrollTop = 0;
}
function renderFlow() {
  Player.stop();                                                             // 화면을 다시 그리면 소리도 멈춤(문장 요소가 새로 만들어짐)
  F.rd = null;
  clearInterval(F.tmTimer);                                                  // 타이머는 setupTimer가 다시 켬
  if (F.tm && F.tm.ctx !== flowCtx()) F.tm = null;                           // 다른 화면으로 가면 타이머 끝
  const rk = rcCtx();
  if (rk !== F.rcQ) F.rcShown = false;                                       // 암송 카드: 다른 화면에서 오면 한글부터
  F.rcQ = rk;
  if (F.kind === "gpt") return renderGpt();
  if (F.kind === "review") return renderReview();
  const w = fWeek();
  if (!w) { hideFlow(); return; }
  const q = Q_BY_ID[F.qid], it = itemOf(w, F.qid), n = w.qs.indexOf(F.qid) + 1;
  const prog = stepIdx(it);
  if (F.warm) {                                                              // 워밍업(3-1): 단계 막대 없이
    FL.title.textContent = "질문 " + n + " / " + w.qs.length + " · 시작 전 워밍업";
    FL.steps.hidden = true;
    FL.steps.innerHTML = "";
    [FL.body.innerHTML, FL.foot.innerHTML] = warmView(w, it);
    setupTimer();
    return;
  }
  FL.title.textContent = "질문 " + n + " / " + w.qs.length + " · " + LEVEL_NAME[q.level];
  FL.steps.hidden = false;
  FL.steps.innerHTML = STEP_NAME.map((nm, i) =>
    '<button class="st' + (i <= prog ? " reached" : "") + (i === F.view ? " cur" : "") + '" data-view="' + i + '" ' + (i > prog ? "disabled" : "") + ">" + nm + "</button>").join("");
  const qHead = '<p class="q-en">' + esc(q.en) + '</p><p class="q-ko">' + esc(q.ko) + "</p>";
  let body = "", foot = "";
  const v = F.view;
  if (v === 0) {                                                             // 쓰기
    const wc = wordCount(it.text);
    body = qHead + '<textarea class="wr" id="fText" placeholder="영어로 써 보세요. 틀려도 괜찮아요 — 첨삭에서 고쳐요." spellcheck="false">' + esc(it.text || "") + "</textarea>" +
      '<div class="wc" id="fWc">' + wc + " 단어</div>";
    foot = '<button class="go" data-act="written" ' + (wc ? "" : "disabled") + ">다 썼어요 · 첨삭 받기" + IC.arrow + "</button>" +
      (qStarted(w, F.qid) ? "" : '<div class="sub-row"><button class="sub-btn" data-act="swap">' + IC.swap + "다른 질문으로 바꾸기</button></div>");
  } else if (v === 1) {                                                      // 첨삭
    const has = (it.pairs || []).some(p => p.en);
    if (!has) {
      const copied = !!it.copied;
      body = qHead + '<ol class="how">' +
        '<li class="' + (copied ? "ok" : "on") + '"><b>첨삭 프롬프트 복사</b> — 내 글이 들어 있어요</li>' +
        '<li class="' + (copied ? "on" : "") + '">ChatGPT에 붙여넣고 보내기</li>' +
        '<li>답 맨 아래 코드블록의 <b>복사</b> 버튼 누르기</li>' +
        '<li>돌아와서 <b>클립보드에서 붙여넣기</b></li></ol>' +
        (it.raw ? '<div class="warn"><b>형식을 읽지 못했어요.</b> 답의 맨 아래 코드블록([최종본]부터 끝까지)을 복사했는지 확인해 주세요. 붙여넣은 글은 아래 칸에 남아 있어요.</div>' : "") +
        '<details class="more"' + (it.raw ? " open" : "") + '><summary>클립보드 버튼이 안 되면 — 여기에 길게 눌러 붙여넣기</summary>' +
        '<textarea class="man" id="fMan" placeholder="여기에 붙여넣으면 바로 읽어요">' + esc(it.raw || "") + "</textarea></details>" +
        '<details class="more"><summary>프롬프트 미리 보기</summary><div class="pre">' + esc(fixPrompt(q, it.text || "")) + "</div></details>";
      foot = copied
        ? '<button class="go" data-act="paste">' + IC.paste + "클립보드에서 붙여넣기</button>" +
          '<div class="sub-row"><button class="sub-btn" data-act="copy">' + IC.copy + "프롬프트 다시 복사</button></div>"
        : '<button class="go" data-act="copy">' + IC.copy + "첨삭 프롬프트 복사</button>";
    } else {
      body = qHead + checkHtml(it);
      foot = '<button class="go" data-act="fixed">이대로 저장 · 듣기로' + IC.arrow + "</button>" +
        '<div class="sub-row"><button class="sub-btn" data-act="repaste">' + IC.paste + "다시 붙여넣기</button>" +
        '<button class="sub-btn" data-act="copy">' + IC.copy + "프롬프트 다시 복사</button></div>";
    }
  } else if (v === 2) {                                                      // 듣기: 문장마다 노래방식(단어 탭 = 그 자리부터)
    body = qHead + listenHtml(it);
    foot = '<button class="go" data-act="next">다 들었어요 · 암송으로' + IC.arrow + "</button>";
  } else if (v === 3) {                                                      // 암송: 한글 보고 말하기 → 영어 보기(소리) → 막힘 없이 / 한 번 더(맨 뒤로)
    [body, foot] = reciteView(it, qHead);
  } else if (v === 4) {                                                      // 말하기: ① 한국어 흐름 + 시간 막대
    [body, foot] = speakView(it, qHead);
  } else {                                                                   // 완료
    const nx = nextEntry(w);
    body = '<div class="donebox"><div class="em">🎉</div><h2>질문 ' + n + " 완료</h2><p>" + esc(q.ko) + "</p></div>" +
      '<div class="box"><div class="box-t">최종본</div>' + (it.pairs || []).filter(p => p.en).map(p =>
        '<p style="margin:6px 0 0;font-size:15.5px;line-height:1.55">' + esc(p.en) + '<br><span style="color:var(--muted);font-size:14px">' + esc(p.ko) + "</span></p>").join("") + "</div>";
    foot = nx
      ? '<button class="go" data-act="go-next">' + nextLabel(nx) + IC.arrow + "</button>"
      : '<button class="go" data-act="close">이번 주 화면으로</button>';

/* ---------- 암송 카드 공통 (암송 단계 · 주말 복습 '섞어서 말하기') ----------
   한 번에 한 문장: 한글만 크게 → [영어 보기] → 영어(노래방식) + 그 문장 소리 자동 재생 → [한 번 더](맨 뒤로) / [막힘 없이 했어요]
   진행 { q: [남은 번호 — 맨 앞이 지금 카드], ok: [끝낸 번호], again: { 번호: 한 번 더 누른 횟수 } } */
function rcProgHtml(done, n, left) {
  const pct = n ? Math.round(done / n * 100) : 0;
  return '<div class="rc-prog"><span>막힘 없이 <b>' + done + "</b> / " + n + "</span><span>" + (left ? "남은 문장 " + left : "다 했어요") + "</span></div>" +
    '<div class="rc-bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + done + '"><i style="width:' + pct + '%"></i></div>';
}
function rcCardHtml(label, again, ko, en) {
  let card = '<div class="rc-card"><div class="rc-n">' + label + (again ? '<span class="rc-again">한 번 더 · ' + again + "</span>" : "") + "</div>" +
    '<div class="rc-ko">' + esc(ko || "(한글 없음 — 첨삭 단계에서 써 넣을 수 있어요)") + "</div>";
  if (F.rcShown) {
    card += '<div class="rc-en"><div class="rc-en-t" lang="en">' + scriptHtml(en) + '</div><button class="spk" data-rc-say aria-label="다시 듣기">' + IC.speaker + "</button></div>" +
      '<p class="rc-hint">내가 말한 것과 같았나요? 막힘 없이 말했으면 오른쪽, 아니면 한 번 더.</p>';
  } else {
    card += '<p class="rc-hint">먼저 소리 내서 영어로 말해 본 뒤 [영어 보기]를 눌러요.</p>';
  }
  return card + "</div>";
}
function rcFootHtml() {
  return F.rcShown
    ? '<div class="two"><button class="outline-btn" data-act="rc-again">한 번 더</button><button class="go" data-act="rc-ok">' + IC.check + "막힘 없이 했어요</button></div>"
    : '<button class="go" data-act="rc-show">영어 보기</button>';
}
/* [영어 보기] · [막힘 없이] · [한 번 더] — rc는 진행 객체, 저장·다시 그리기까지 */
function rcStep(rc, act) {
  if (act === "rc-show") { F.rcShown = true; F.rcAuto = true; buzz(); renderFlow(); return; }
  const i = rc.q.shift();
  if (i == null) return;
  if (act === "rc-ok") rc.ok.push(i);
  else { rc.again[i] = (rc.again[i] || 0) + 1; rc.q.push(i); toast(rc.q.length > 1 ? "맨 뒤로 보냈어요 — 다른 문장 뒤에 다시 나와요" : "한 번 더 해 봐요"); }
  F.rcShown = false;
  save(); buzz(); renderFlow();
}
/* 지금 보이는 암송 카드의 영어 — 소리(영어 보기를 누른 직후에만 자동) */
function setupRecite() {
  const el = FL.body.querySelector(".rc-en .sc");
  if (!el) return;
  F.rd = createReader({ items: () => [{ el: FL.body.querySelector(".rc-en .sc"), btn: FL.body.querySelector("[data-rc-say]") }], rate: () => settings.rate });
  if (F.rcAuto) { F.rcAuto = false; F.rd.play(0, 0, true); }
}

/* ---------- 암송 단계 (2-3): 질문 하나의 최종본 문장들 ----------
   진행은 항목의 rc에 저장(중간에 나가도 이어서) + sig(최종본 영어의 해시 — 영어가 바뀌면 처음부터) */
function reciteSig(it) { return String(hashStr((it.pairs || []).map(p => p.en).join("\n"))); }
function reciteState(it) {
  const n = (it.pairs || []).filter(p => p.en).length, sig = reciteSig(it);
  if (!it.rc || it.rc.sig !== sig || !Array.isArray(it.rc.q) || !Array.isArray(it.rc.ok)) {
    it.rc = { sig, q: Array.from({ length: n }, (_, i) => i), ok: [], again: {} };
  }
  return it.rc;
}
function reciteView(it, qHead) {
  const ps = (it.pairs || []).filter(p => p.en), rc = reciteState(it), n = ps.length;
  if (!n) return [qHead + '<div class="warn">최종본 문장이 없어요. 첨삭 단계에서 결과를 붙여넣어 주세요.</div>', ""];
  const prog = rcProgHtml(rc.ok.length, n, rc.q.length);
  if (!rc.q.length) {
    const tried = Object.keys(rc.again).length;
    return [qHead + prog + '<div class="donebox" style="margin-top:22px"><div class="em">👏</div><h2>모든 문장을 막힘 없이 말했어요</h2><p>' +
      (tried ? "한 번 더 한 문장 " + tried + "개도 끝까지 해냈어요" : "한 번에 다 말했어요") + "</p></div>",
      '<button class="go" data-act="next">다음 · 자유롭게 말하기' + IC.arrow + "</button>" +
      '<div class="sub-row"><button class="sub-btn" data-act="rc-reset">처음부터 다시 해 보기</button></div>'];
  }
  const i = rc.q[0];
  return [qHead + prog + rcCardHtml((i + 1) + "번 문장", rc.again[i] || 0, ps[i].ko, ps[i].en), rcFootHtml()];
}
function reciteAct(it, act) {
  const rc = reciteState(it);
  if (act === "rc-reset") { it.rc = null; reciteState(it); F.rcShown = false; save(); buzz(); renderFlow(); FL.body.scrollTop = 0; return; }
  rcStep(rc, act);
}

/* ---------- 시간 상자 공통 (말하기 단계 · 워밍업 · 주말 복습 조건 말하기) ----------
   F.tm = { ctx(어느 화면의 타이머인지), start, end(멈춘 시각, 0 = 흐르는 중), goal(초) }. 화면(ctx)이 바뀌면 renderFlow가 지움.
   [말하기 시작] → 큰 시계 + 막대가 goal까지 차오름(넘기면 꽉 찬 줄무늬, 시계는 계속) → [다 말했어요] → 걸린 시간. 실제 시각으로 셈 */
const fmtSec = s => Math.floor(s / 60) + ":" + pad2(Math.floor(s % 60));
const goalLabel = s => (s % 60 ? (s >= 60 ? Math.floor(s / 60) + "분 " : "") + (s % 60) + "초" : s / 60 + "분");
function timerOf(ctx) { return F.tm && F.tm.ctx === ctx ? F.tm : null; }
function timerState(ctx) { const tm = timerOf(ctx); return !tm ? "idle" : tm.end ? "stopped" : "running"; }
function timerSec(tm) { return tm ? ((tm.end || Date.now()) - tm.start) / 1000 : 0; }
function timerMsg(state, sec, goal, idle) {
  if (state === "running") return sec < goal ? "말하는 중… 목표까지 " + fmtSec(goal - sec) : "목표 시간이 지났어요 · 더 말해도 돼요";
  if (state === "stopped") return fmtSec(sec) + " 동안 말했어요" + (sec >= goal ? " — 목표 시간을 채웠어요 👏" : "");
  return idle;
}
function timerHtml(ctx, goal, idle) {
  const tm = timerOf(ctx), state = timerState(ctx), sec = timerSec(tm);
  return '<div class="tm' + (state === "running" ? " on" : "") + '"><div class="tm-row"><span class="tm-t" id="tmT">' + fmtSec(sec) + '</span><span class="tm-goal">목표 약 ' + goalLabel(goal) + "</span></div>" +
    '<div class="tm-bar' + (sec >= goal ? " over" : "") + '"><i id="tmBar" style="width:' + Math.min(100, sec / goal * 100) + '%"></i></div>' +
    '<p class="tm-msg" id="tmMsg">' + timerMsg(state, sec, goal, idle) + "</p></div>";
}
function timerStart(ctx, goal) { F.tm = { ctx, start: Date.now(), end: 0, goal }; buzz(); renderFlow(); }
function timerStop() {                                                        // → 걸린 초(반올림), 흐르는 중이 아니면 null
  if (!F.tm || F.tm.end) return null;
  F.tm.end = Date.now();
  buzz();
  return Math.round((F.tm.end - F.tm.start) / 1000);
}
function setupTimer() {
  clearInterval(F.tmTimer);
  const tm = F.tm;
  if (!tm || tm.end || !$("tmT")) return;
  const tick = () => {
    const t = $("tmT");
    if (!t || F.tm !== tm || tm.end) { clearInterval(F.tmTimer); return; }
    const sec = (Date.now() - tm.start) / 1000;
    t.textContent = fmtSec(sec);
    $("tmBar").style.width = Math.min(100, sec / tm.goal * 100) + "%";
    $("tmBar").parentNode.classList.toggle("over", sec >= tm.goal);
    $("tmMsg").textContent = timerMsg("running", sec, tm.goal, "");
  };
  tick();
  F.tmTimer = setInterval(tick, 250);
}

/* ---------- 말하기 단계 (2-4): ① 한국어 흐름만 보고 내 말로 ----------
   목표 시간 = 최종본 영어 단어 수 × 0.6초(자유롭게 다시 말하는 속도 — 분당 약 100단어), 10초 단위로 반올림, 30초~2분 30초 */
function speakGoal(it) {
  const words = (it.pairs || []).reduce((n, p) => n + wordCount(p.en), 0);
  return Math.max(30, Math.min(150, Math.round(words * 0.6 / 10) * 10));
}
function speakView(it, qHead) {
  const ctx = "speak:" + F.qid, state = timerState(ctx);
  const body = qHead + '<div class="box-t" style="margin-top:20px">이 흐름만 보고 내 말로 다시 말해 보세요</div>' +
    '<div class="big-flow">' + (it.flow ? esc(it.flow) : "흐름이 없어요 — 첨삭 결과에 [흐름]이 있는지 확인해 주세요") + "</div>" +
    timerHtml(ctx, speakGoal(it), it.spoke ? "지난번 " + fmtSec(it.spoke.sec) + " 말했어요 · 다시 해도 돼요" : "[말하기 시작]을 누르고 말해요. 시간이 막대로 보여요") +
    '<p class="note">외운 문장 그대로가 아니어도 괜찮아요. 막히면 다른 말로 돌려 말해요.</p>';
  let foot;
  if (state === "running") foot = '<button class="go" data-act="sp-stop">' + IC.check + "다 말했어요</button>";
  else if (state === "stopped") foot = '<button class="go" data-act="next">질문 완료' + IC.arrow + "</button>" +
    '<div class="sub-row"><button class="sub-btn" data-act="sp-start">다시 말해 보기</button></div>';
  else foot = '<button class="go" data-act="sp-start">' + IC.play + "말하기 시작</button>" +
    '<div class="sub-row"><button class="sub-btn" data-act="next">시간 재지 않고 완료</button></div>';
  return [body, foot];
}
function speakAct(it, act) {
  if (act === "sp-start") { timerStart("speak:" + F.qid, speakGoal(it)); return; }
  if (act === "sp-stop") { const sec = timerStop(); if (sec != null) { it.spoke = { sec, on: dateKey() }; save(); renderFlow(); } }
}

/* ---------- 워밍업 (3-1): 다음 질문을 시작하기 직전, 앞 질문을 ② 영어 키워드만 보고 1분 다시 말하기 ----------
   언제: 질문 n(2번째부터)을 열었는데 아직 아무것도 안 썼고(쓰기 단계·글 없음), 바로 앞 질문(질문 n−1)이 끝났고 키워드가 있을 때 — 한 번만.
   화면: 앞 질문 + 키워드(크게) + 시간 상자(목표 1분) → [말하기 시작] → [다 말했어요] → [질문 n 쓰기로]. 작은 [워밍업 건너뛰기].
   끝내거나 건너뛰면 질문 n의 항목에 warm = { from: 앞 질문 id, sec?(말한 시간), skip?, on: 날짜 } — 다시 안 나옴 */
const WARM_GOAL = 60;
/* 숫자 뒤 을/를: 끝자리를 읽은 소리에 받침이 있으면(0 영·1 일·3 삼·6 육·7 칠·8 팔) 을, 없으면 를 */
const eulReul = n => ("013678".includes(String(n).slice(-1)) ? "을" : "를");
function warmFrom(w, qid) {
  const k = w.qs.indexOf(qid);
  if (k < 1) return null;
  const it = w.items[qid], prev = w.qs[k - 1], pit = w.items[prev];
  if (it && (it.warm || stepIdx(it) > 0 || (it.text || "").trim())) return null;
  if (!pit || pit.step !== "done" || !(pit.keywords || []).length) return null;
  return prev;
}
function warmView(w, it) {
  const prev = F.warmPrev, pq = Q_BY_ID[prev], pit = w.items[prev], n = w.qs.indexOf(F.qid) + 1;
  const ctx = "warm:" + F.qid, state = timerState(ctx);
  const body = '<div class="wu-k">워밍업 · 1분</div>' +
    '<p class="wu-t">질문 ' + n + eulReul(n) + " 시작하기 전에, 앞 질문 이야기를 키워드만 보고 다시 말해 봐요</p>" +
    '<div class="box"><div class="box-t">앞 질문 · 질문 ' + (n - 1) + '</div><div style="font-size:15.5px;font-weight:650;line-height:1.5">' + esc(pq.ko) + "</div></div>" +
    '<div class="box-t" style="margin-top:20px">영어 키워드</div><div class="kw kw-big">' + (pit.keywords || []).map(x => "<span lang=\"en\">" + esc(x) + "</span>").join("") + "</div>" +
    timerHtml(ctx, WARM_GOAL, "[말하기 시작]을 누르고 1분 동안 말해요. 짧게 해도 괜찮아요") +
    '<p class="note">문장을 그대로 외워 말하지 않아도 돼요. 키워드를 이어서 내 말로.</p>';
  let foot;
  if (state === "running") foot = '<button class="go" data-act="wu-stop">' + IC.check + "다 말했어요</button>";
  else if (state === "stopped") foot = '<button class="go" data-act="wu-done">질문 ' + n + " 쓰기로" + IC.arrow + "</button>" +
    '<div class="sub-row"><button class="sub-btn" data-act="wu-start">다시 말해 보기</button></div>';
  else foot = '<button class="go" data-act="wu-start">' + IC.play + "말하기 시작</button>" +
    '<div class="sub-row"><button class="sub-btn" data-act="wu-skip">워밍업 건너뛰기</button></div>';
  return [body, foot];
}
function warmAct(it, act) {
  if (act === "wu-start") { timerStart("warm:" + F.qid, WARM_GOAL); return; }
  if (act === "wu-stop") { const sec = timerStop(); if (sec != null) { F.warmSec = sec; renderFlow(); } return; }
  if (act === "wu-done" || act === "wu-skip") {
    it.warm = { from: F.warmPrev, on: dateKey() };
    if (act === "wu-skip") it.warm.skip = true; else if (F.warmSec != null) it.warm.sec = F.warmSec;
    F.warmPrev = null; F.warmSec = null;
    F.warm = false; F.view = 0;
    save(); buzz(); renderFlow(); FL.body.scrollTop = 0;
  }
}

/* 새 답변(첨삭 붙여넣기 뒤 it.paraWant)의 문단 음성을 저장 안 된 것만 뒤에서 만들어 둠 — 듣기 단계에서 문장 음성을 들을 때.
   키가 없거나 인터넷이 없으면 안 함. 다 만들면 paraWant를 지움(최종본을 다시 붙여넣으면 바뀐 문단만 새로 — 음성 키가 문단 글이라서) */
const PARA_BUSY = new Set();
async function paraEnsure(it) {
  if (!settings.apiKey || navigator.onLine === false || PARA_BUSY.has(it)) return;
  PARA_BUSY.add(it);
  let ok = true;
  try {
    for (const p of paraList(it)) {
      const t = getScript(p.en).speech;
      if (await Player.isCached(t)) continue;
      try { await Player.fetchClip(t); } catch (e) { ok = false; break; }   // 실패하면 다음에 다시(키 오류·크레딧 부족이면 더 안 함)
    }
  } finally { PARA_BUSY.delete(it); }
  if (ok && it.paraWant) { delete it.paraWant; saveSoon(); }
}
/* ---------- 듣기 단계 (2단계): 최종본 문장마다 노래방식 ----------
   [전체 듣기]는 1번부터 끝까지 이어서(문장 사이 0.45초), 문장 옆 스피커는 그 문장만(다시 누르면 멈춤),
   단어를 누르면 그 단어부터(이어 듣는 중이면 거기서부터 계속, 아니면 그 문장만). 속도는 설정과 같은 값.
   음성은 문장마다 따로 캐시 → 다시 들을 땐 크레딧 없음, 한글만 고치면 음성은 그대로 */
function listenHtml(it) {
  const ps = (it.pairs || []).filter(p => p.en);
  return '<div class="ls-bar"><button class="ls-play" data-ls="all">' + IC.play + "전체 듣기</button>" +
    '<div class="seg rate-seg" role="group" aria-label="속도">' + RATES.map(r => '<button data-rate="' + r + '" aria-pressed="' + (settings.rate === r) + '">' + rateLabel(r) + "</button>").join("") + "</div></div>" +
    '<p class="note">단어를 누르면 그 자리부터 들어요.' + (settings.apiKey ? "" : " 지금은 API 키가 없어서 폰 기본 음성으로 읽어요(설정에서 넣을 수 있어요).") + "</p>" +
    '<ul class="pairs" id="lsList">' + ps.map((p, i) =>
      '<li class="pair ls-row" data-i="' + i + '"><span class="pn">' + (i + 1) + '</span><div class="pb"><div class="pe" lang="en">' + scriptHtml(p.en) + '</div><div class="pko">' + esc(p.ko) + "</div></div>" +
      '<button class="spk" data-say="' + i + '" aria-label="' + (i + 1) + '번 문장 듣기">' + IC.speaker + "</button></li>").join("") + "</ul>";
}
function setupListen() {
  const rows = () => Array.from(FL.body.querySelectorAll(".ls-row"));
  const mark = i => rows().forEach((r, k) => r.classList.toggle("cur", k === i));
  F.rd = createReader({
    items: () => rows().map(r => ({ el: r.querySelector(".sc"), btn: r.querySelector(".spk") })),
    rate: () => settings.rate,
    gap: 450,
    onItem: i => {
      mark(i);
      const w = fWeek(), it = w && itemOf(w, F.qid);
      if (it && it.paraWant) paraEnsure(it);                                  // 새 답변의 음성을 만들 때 문단 음성도 같이
      const r = rows()[i];
      if (r) {                                                                // 그 문장이 보이게
        const b = FL.body.getBoundingClientRect(), rr = r.getBoundingClientRect();
        if (rr.top < b.top + 8 || rr.bottom > b.bottom - 8) autoScroll(FL.body, FL.body.scrollTop + rr.top - b.top - 12);
      }
    },
    onEnd: () => mark(-1),
    onChange: paintListen
  });
  paintListen();
}
function paintListen() {
  const b = FL.body.querySelector('[data-ls="all"]');
  if (!b || !F.rd) return;
  const s = F.rd.state();
  const playingAll = s.active && !s.single;
  b.innerHTML = playingAll && !s.paused ? IC.pause + "일시정지" : playingAll ? IC.play + "이어 듣기" : IC.play + "전체 듣기";
}
Player.onChange(() => { if (F.open && F.kind === "q" && F.view === 2) paintListen(); });
/* 암송: 영어 옆 스피커 = 다시 듣기(듣는 중이면 멈춤), 단어 = 그 단어부터 */
FL.body.addEventListener("click", e => {
  if (!F.rd || !FL.body.querySelector(".rc-en")) return;                 // 암송 카드(암송 단계·주말 복습)
  if (e.target.closest("[data-rc-say]")) { const s = F.rd.state(); if (s.active) F.rd.stop(); else F.rd.play(0, 0, true); return; }
  const w = e.target.closest(".rc-en .sc .w");
  if (w) F.rd.seek(0, +w.dataset.w);
});   // 일시정지·이어 듣기·끊김 때도 버튼 모양을 맞춤
function setRate(r) {
  if (!RATES.includes(r)) return;
  settings.rate = r;
  saveSettings();
  Player.setRate(r);
  document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === r)));
  buzz();
}
FL.body.addEventListener("click", e => {
  if (F.kind !== "q" || F.view !== 2 || !F.rd) return;
  const t = e.target;
  let b;
  if ((b = t.closest("[data-rate]"))) { setRate(+b.dataset.rate); return; }
  if ((b = t.closest('[data-ls="all"]'))) {
    const s = F.rd.state();
    if (s.active && !s.single) F.rd.toggle(); else F.rd.play(0, 0, false);
    buzz(); return;
  }
  if ((b = t.closest("[data-say]"))) {
    const i = +b.dataset.say, s = F.rd.state();
    if (s.active && s.index === i && s.single) F.rd.stop(); else F.rd.play(i, 0, true);
    return;
  }
  const row = t.closest(".ls-row"), area = row && t.closest(".pe");          // 단어 = 그 단어부터(가까운 단어도, 스크롤하다 눌린 건 무시)
  if (!area || !lsTapOk()) return;
  const w = wordAtTap(e, area);
  if (!w) return;
  flashWord(w);
  F.rd.seek(+row.dataset.i, +w.dataset.w);
});
const lsTapOk = tapGuard(FL.body);
/* 첨삭 결과 확인: 문장 짝(한글은 바로 고칠 수 있음) + 개수 경고 + 상황 묘사 */
function checkHtml(it) {

  } else {
    h += '<p class="note" style="margin-top:16px">영어 ' + nEn + "문장 · 한글 " + nKo + "문장 — 짝이 맞아요. 한글은 눌러서 바로 고칠 수 있어요.</p>";
  }
  h += '<ul class="pairs">';
  let k = 0;
  ps.forEach((p, i) => {
    h += '<li class="pair' + (p.en && p.ko ? "" : " bad") + '"><span class="pn">' + (p.en ? ++k : "·") + '</span><div class="pb">' +
      (p.en ? '<div class="pe">' + esc(p.en) + "</div>" : '<div class="pe none">영어 없음</div>') +
      '<textarea class="pk' + (p.ko ? "" : " empty") + '" data-ko="' + i + '" rows="1" placeholder="한글을 써 주세요" aria-label="' + (k || "") + '번 한글">' + esc(p.ko) + "</textarea></div></li>";
  });
  h += "</ul>";
  const miss = [!it.flow && "흐름", !(it.keywords || []).length && "키워드", !(it.conds || []).length && "조건"].filter(Boolean);

/* =====================================================================

   진행은 주의 review에 저장(중간에 나가도 이어서): { sig, deck: [[질문 id, 문장 번호]], q, ok, again, phase: rc|cond|done,
     cq: [조건 말할 질문 id], ci, cond: { 질문 id: 조건 번호 }, spoke: { 질문 id: 초 }, doneOn }

  const rv = w.review;
  if (rv && (rv.sig === sig || rv.doneOn) && Array.isArray(rv.deck)) return rv;
  /* 섞기: 같은 질문 문장이 되도록 연달아 나오지 않게(바로 앞과 다른 질문 중에서 무작위, 없으면 아무거나).

      "<br>조건 바꿔 말하기 · 질문 " + rv.cq.length + "개" + (said ? " (시간 잰 것 " + said + "개)" : "") + "</p></div>";
    foot = '<button class="go" data-act="close">이번 주 화면으로</button>';

}
function onReviewAct(act) {
  const w = fWeek();
  if (!w) return;
  const rv = reviewState(w);
  if (act.startsWith("rc-")) { rcStep(rv, act); return; }
  if (act === "rv-cond") { rv.phase = "cond"; rv.ci = 0; save(); buzz(); renderFlow(); FL.body.scrollTop = 0; return; }
  if (act === "rv-start") { const qid = rv.cq[rv.ci]; timerStart("rv:" + qid, speakGoal(w.items[qid])); return; }
  if (act === "rv-stop") { const sec = timerStop(); if (sec != null) { rv.spoke[rv.cq[rv.ci]] = sec; save(); renderFlow(); } return; }
  if (act === "rv-cnext") { rv.ci = Math.min(rv.ci + 1, rv.cq.length - 1); save(); buzz(); renderFlow(); FL.body.scrollTop = 0; return; }
  if (act === "rv-finish") { rv.phase = "done"; rv.doneOn = dateKey(); save(); buzz(); renderFlow(); FL.body.scrollTop = 0; return; }
  if (act === "close") closeFlow();
}

/* =====================================================================
   듣기 탭 (4단계 — 한 장 영어 드라이브 모드를 일기 전용으로 줄임)
   시작 화면(탭 첫 화면): 범위 [이번 주 | 지난 주 | 전체] · 속도 · 들을 분량 · 미리 받아두기 · [시작] / [처음부터][이어 듣기]
   재생 화면(#drive, 탭 바를 덮음): 질문(영어, 한글 작게) → 그 질문의 최종본 → 다음 질문 … 끝까지 이어서.
     끊지 않고 듣기(2026-10-08) = 문단마다 음성 하나(paraList — 원래 글의 빈 줄로 문단을 나눔, ElevenLabs로 문단을 통째로 만들어 저장).
       화면은 질문 하나를 글로(질문 → 문단마다 영어 + 아래 한국어, 사이 구분선, 지금 문단 노래방식 — dvShowBlock). 질문 → 문단 0.45초, 문단 사이 0.7초.
       단어를 누르면 그 단어부터(dvSeek — 타임스탬프로 그 자리, 다른 문단이면 그 음성으로, 일시정지·끝이면 거기서 재생 · 2026-10-08).
     따라 말하기 = 문장마다(문장 사이 0.45초 + 따라 말할 시간). 새 질문 앞 1.2초. 큰 버튼 [이전][재생/일시정지][다음](문단/문장) + [다음 질문].
     잠금화면·블루투스·차: 재생/일시정지 · 다음/이전 = 다음/이전 문장(Media Session) — 짧은 소리만으로는 폰이 조작을 붙여 주지 않아서
     재생하는 동안 조용한 소리(44.1kHz·16비트, 6초 반복)를 틀어 둠(한 장 영어와 같은 방식).
   문장 = 첨삭을 저장한(듣기 단계까지 간) 질문의 최종본 영어. 범위 '전체'는 최신 주부터.
   듣기 방식(opts.mode): 끊지 않고 듣기(flow) / 따라 말하기(one — 문장이 끝나면 그 문장이 재생된 시간만큼 "따라 말해 보세요" 막대,
     한 장 영어 드라이브 모드의 dvGap과 같음: 재생 시간(속도 반영) 1.2~12초 + 0.25초, 못 재면 단어 × 0.38초 ÷ 속도. 질문은 쉬지 않음).
     반복 횟수(opts.rep 1·3·5 — 따라 말하기일 때만): 재생 → 쉼 → 다시 재생 … 횟수만큼 한 뒤 다음 문장(한 장 영어 rvEchoEnd 방식). 질문은 한 번만.
   뺀 것(일기 전용으로 줄임): 효과음, 랜덤 순서. 화면 꺼짐 방지는 아직 안 넣음(사용자가 폰으로 보고 정함)
   저장 ediary.drive.v1 { opts: { scope: week|pick|all, wk, mode: flow|one, rep: 1|3|5 }, pos: { scope, wk, key, label } | null } — key = "주|질문 id|문장 번호(-1 = 질문)"
   ===================================================================== */
const DRIVE_KEY = "ediary.drive.v1", DV_REPS = [1, 3, 5];
const DV = (() => {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(DRIVE_KEY) || "null"); } catch (e) {}
  const opts = Object.assign({ scope: "week", wk: null, mode: "flow", rep: 1 }, s && s.opts || {});
  if (!["week", "pick", "all"].includes(opts.scope)) opts.scope = "week";
  if (!["flow", "one"].includes(opts.mode)) opts.mode = "flow";
  if (!DV_REPS.includes(opts.rep)) opts.rep = 1;
  return { opts, pos: s && s.pos && typeof s.pos.key === "string" ? s.pos : null,
    open: false, pl: null, idx: 0, done: false, interrupted: false, rd: null, els: [], ka: null, kaSelf: false, kaWant: false, kaT: 0, pre: null, echo: false, say: "", tapK: -1 };
})();
function saveDrive() { try { localStorage.setItem(DRIVE_KEY, JSON.stringify({ opts: DV.opts, pos: DV.pos })); } catch (e) {} }
const DV_GAP = 450, DV_GAP_Q = 1200, DV_GAP_P = 700;   // 문장·질문 → 다음 · 새 질문 앞 · 문단 사이(끊지 않고 듣기)
function weekTitle(wk) { const w = store.weeks[wk], t = w && TOPIC_BY_ID[w.topic]; return t ? t.emoji + " " + t.ko : "📝 " + (w ? w.topic : ""); }
/* 범위에 들어가는 주(최신이 앞) */
function driveWeeks(o) {
  if (o.scope === "week") return [weekKey()];
  if (o.scope === "pick") return o.wk && o.wk < weekKey() && store.weeks[o.wk] ? [o.wk] : [];   // 지난 주 = 이번 주보다 앞 주만
  return Object.keys(store.weeks).sort().reverse();
}
const scopeKey = o => o.scope + (o.scope === "pick" ? ":" + (o.wk || "") : "");
/* 재생 목록: 질문마다 { kind: q, 질문 영어 } + 따라 말하기면 { kind: s, 문장 }, 끊지 않고 듣기면 { kind: p, 문단(음성 하나) }. 블록 = 질문 하나 */
function buildDrive(o) {
  if (o.mode !== "one") return buildDriveParas(o);
  return buildDriveSents(o);
}
function buildDriveParas(o) {
  const items = [], blocks = [];
  driveWeeks(o).forEach(wk => {
    const w = store.weeks[wk];
    if (!w) return;
    w.qs.forEach((qid, qi) => {
      const it = w.items[qid], q = Q_BY_ID[qid];
      if (!it || !q || stepIdx(it) < 2) return;
      const pa = paraList(it);
      if (!pa[0] || !pa[0].idx.length) return;
      blocks.push({ start: items.length, wk, qid, n: qi + 1 });
      const b = blocks.length - 1;
      items.push({ kind: "q", text: q.en, ko: q.ko, wk, qid, n: qi + 1, b, key: wk + "|" + qid + "|-1" });
      pa.forEach((p, j) => items.push({ kind: "p", text: p.en, ko: p.ko, wk, qid, n: qi + 1, b, j, total: pa.length, sents: p.idx, key: wk + "|" + qid + "|p" + j }));
    });
  });
  return { items, blocks };
}
function buildDriveSents(o) {
  const items = [], blocks = [];
  driveWeeks(o).forEach(wk => {
    const w = store.weeks[wk];
    if (!w) return;
    w.qs.forEach((qid, qi) => {
      const it = w.items[qid], q = Q_BY_ID[qid];
      if (!it || !q || stepIdx(it) < 2) return;
      const ps = (it.pairs || []).filter(p => p.en);
      if (!ps.length) return;
      blocks.push({ start: items.length, wk, qid, n: qi + 1 });
      const b = blocks.length - 1;
      items.push({ kind: "q", text: q.en, ko: q.ko, wk, qid, n: qi + 1, b, key: wk + "|" + qid + "|-1" });
      ps.forEach((p, i) => items.push({ kind: "s", text: p.en, ko: p.ko, wk, qid, n: qi + 1, b, i, total: ps.length, key: wk + "|" + qid + "|" + i }));
    });
  });
  return { items, blocks };
}
function driveMinutes(pl, rate, mode, rep) {
  const words = pl.items.reduce((n, it) => n + wordCount(it.text), 0);
  let sec = words / 2.5 / rate + pl.items.length * DV_GAP / 1000 + pl.blocks.length * DV_GAP_Q / 1000;   // 말 속도 약 분당 150단어
  if (mode === "one") pl.items.forEach(it => {                              // 따라 말할 시간 × 횟수 + 다시 듣는 시간
    if (it.kind !== "s") return;
    const say = wordCount(it.text) / 2.5 / rate, n = rep || 1;
    sec += n * (Math.min(12, Math.max(1.2, say)) + 0.25) + (n - 1) * say;
  });
  return Math.max(1, Math.round(sec / 60));
}
function dvResumeIdx(pl) {
  const p = DV.pos;
  if (!p || p.scope !== scopeKey(DV.opts)) return -1;
  const k = pl.items.findIndex(it => it.key === p.key);
  if (k >= 0) return k;
  const [wk, qid, part] = p.key.split("|"), b = pl.blocks.find(x => x.wk === wk && x.qid === qid);
  if (!b) return -1;
  const inQ = pl.items.map((it, j) => [it, j]).filter(([it]) => it.b === pl.blocks.indexOf(b));
  if (/^\d+$/.test(part || "")) {                                            // 문장 위치 → 끊지 않고 듣기에선 그 문장이 든 문단
    const m = inQ.find(([it]) => it.kind === "p" && it.sents.includes(+part));
    if (m) return m[1];
  } else if (/^p\d+$/.test(part || "")) {                                    // 문단 위치 → 따라 말하기에선 그 문단의 첫 문장
    const src = store.weeks[wk] && store.weeks[wk].items[qid], pa = src ? paraList(src) : [];
    const first = pa[+part.slice(1)] ? pa[+part.slice(1)].idx[0] : -1;
    const m = inQ.find(([x]) => x.kind === "s" && x.i === first);
    if (m) return m[1];
  }
  return b.start;                                                            // 그 문장이 없어졌으면 그 질문 처음
}

/* ---- 시작 화면 ---- */

/* 미리 받아두기: 이 범위에서 폰에 저장 안 된 문장만 ElevenLabs로 만들어 둠(차에서 끊기지 않게). 키가 없으면 안내만 */

function stRender() {
  ST.clearAsk = false;
  ST.body.innerHTML = '<div class="st-sec" style="margin-bottom:28px"><h2>글자 크기</h2>' +
    '<p class="note">문장을 보며 말하는 화면(듣기·암송·말하기·워밍업·주말 복습·듣기 탭)의 글자 크기예요.</p>' +
    '<div class="seg" role="group" aria-label="글자 크기" style="margin-top:12px">' +
    TEXT_ZOOMS.map((z, i) => '<button data-tz="' + z + '" aria-pressed="' + (settings.textZoom === z) + '">' + ["기본", "크게", "더 크게", "아주 크게"][i] + "</button>").join("") + "</div>" +
    '<div class="tz-prev" aria-hidden="true"><div class="en">I usually crash right after a night shift.</div><div class="ko">야간 끝나면 보통 바로 뻗어.</div></div></div>' +
    '<div class="st-sec"><h2>음성</h2>' +
    '<p class="note">일기 문장을 읽어 줄 목소리예요. ElevenLabs API 키가 있으면 자연스러운 목소리로, 없으면 폰 기본 음성으로 읽어요. 한 번 만든 문장 음성은 폰에 저장돼서 다시 들을 때는 크레딧이 들지 않아요.</p>' +
    '<label class="st-l" for="stKey">ElevenLabs API 키</label>' +
    '<div class="key-row"><input class="inp masked" id="stKey" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" placeholder="키를 붙여넣으세요" value="' + esc(settings.apiKey) + '">' +
    '<button class="sub-btn" data-st="show" aria-pressed="false">보기</button></div>' +
    '<p class="key-state" id="stKeyState">' + keyState() + "</p>" +
    '<label class="st-l" for="stVoice">목소리</label><select class="sel" id="stVoice">' +
    EL_VOICES.map(v => '<option value="' + v.id + '"' + (v.id === settings.voice ? " selected" : "") + ">" + esc(v.name) + "</option>").join("") + "</select>" +
    '<label class="st-l" for="stModel">모델</label><select class="sel" id="stModel">' +
    EL_MODELS.map(v => '<option value="' + v.id + '"' + (v.id === settings.model ? " selected" : "") + ">" + esc(v.name) + "</option>").join("") + "</select>" +
    '<div class="st-l">속도</div><div class="seg" role="group" aria-label="속도">' +
    RATES.map(r => '<button data-rate="' + r + '" aria-pressed="' + (settings.rate === r) + '">' + rateLabel(r) + "</button>").join("") + "</div>" +
    '<button class="outline-btn" data-st="try">' + IC.speaker + "목소리 들어보기</button>" +
    '<button class="outline-btn danger" data-st="clear">저장된 음성 지우기</button>' +
    '<p class="note">목소리 들어보기는 짧은 문장 하나(약 50자)를 만들어요. 목소리나 모델을 바꾸면 문장 음성을 새로 만들어요.</p></div>';
}
function openSettings() {
  if (ST.open) return;
  ST.open = true;
  history.pushState({ settings: 1 }, "");
  stRender();
  ST.el.hidden = false;
  $("app").inert = true;
  ST.body.scrollTop = 0;
}
function stHide() {
  Player.stop();
  clearTimeout(ST.keyT);
  saveSettings();
  ST.open = false;
  ST.el.hidden = true;
  $("app").inert = false;
}
function closeSettings() { if (ST.open && history.state && history.state.settings) history.back(); else stHide(); }
$("stX").addEventListener("click", closeSettings);
document.addEventListener("click", e => { if (e.target.closest("[data-open-settings]")) openSettings(); });
ST.body.addEventListener("input", e => {
  if (e.target.id !== "stKey") return;
  clearTimeout(ST.keyT);
  ST.keyT = setTimeout(() => {
    settings.apiKey = e.target.value.replace(/\s+/g, "");
    saveSettings();
    $("stKeyState").innerHTML = keyState();
  }, 300);
});
ST.body.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "stVoice" && EL_VOICES.some(v => v.id === t.value)) settings.voice = t.value;
  else if (t.id === "stModel" && EL_MODELS.some(v => v.id === t.value)) settings.model = t.value;
  else return;
  Player.stop();
  saveSettings();
  buzz();
});
ST.body.addEventListener("click", e => {
  const b = e.target.closest("[data-st], [data-rate], [data-tz]");
  if (!b) return;
  if (b.dataset.rate) { setRate(+b.dataset.rate); return; }
  if (b.dataset.tz) {                                                          // 글자 크기: 바로 반영(미리보기 상자도)
    const z = +b.dataset.tz;
    if (!TEXT_ZOOMS.includes(z)) return;
    settings.textZoom = z; saveSettings(); applyTextZoom();
    ST.body.querySelectorAll("[data-tz]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.tz === z)));
    buzz(); return;
  }
  const a = b.dataset.st;
  if (a === "show") {
    const inp = $("stKey"), on = inp.classList.contains("masked");             // 비밀번호 칸이 아니라 가린 글 칸(폰이 비밀번호로 저장하자고 묻지 않게)
    inp.classList.toggle("masked", !on);
    b.textContent = on ? "숨기기" : "보기";
    b.setAttribute("aria-pressed", String(on));
  } else if (a === "try") {
    if (b.classList.contains("playing")) { Player.stop(); return; }
    const k = $("stKey").value.replace(/\s+/g, "");                              // 방금 붙여넣은 키도 바로 반영
    if (k !== settings.apiKey) { settings.apiKey = k; saveSettings(); $("stKeyState").innerHTML = keyState(); }
    Player.play(TRY_TEXT, b, {});
  } else if (a === "clear") {
    if (!ST.clearAsk) { ST.clearAsk = true; b.textContent = "한 번 더 누르면 지워요"; return; }
    Player.stop();
    AudioCache.clear();
    ST.clearAsk = false;
    b.textContent = "저장된 음성 지우기";
    toast("저장된 음성을 지웠어요");
  }
});

/* ---------- 날짜가 바뀌면(자정·새 주) 화면을 새로 ---------- */
let lastDay = dateKey();
setInterval(() => {
  const d = dateKey();
  if (d === lastDay) return;
  lastDay = d;
  if (!F.open && tab === "week") renderWeek();
}, 15000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") { if (saveTimer) { clearTimeout(saveTimer); save(); } return; }
  if (!F.open && tab === "week") renderWeek();
});

/* ---------- 앱 업데이트(5단계) ----------
   ① sw.js는 늘 인터넷의 최신 파일을 먼저 받음(no-cache) → 앱을 새로 열면 새 버전.
   ② 새 버전을 올릴 때마다 sw.js의 CACHE 숫자를 올림 → 앱을 쓰다가 다시 화면으로 돌아올 때(visibilitychange) 새 서비스워커를 확인(update),
      받아서 바꿔 끼워지면(controllerchange) 위쪽에 "새 버전이 나왔어요 [새로 고침]" — 말하기·듣기 중일 수 있어서 저절로 새로 고치지 않음.
   처음 설치할 때(원래 서비스워커가 없을 때)는 막대를 띄우지 않음. https에서만 등록(로컬 테스트는 테스트가 직접 등록) */
const UPD = { had: false, reg: null };
function showUpdate() { $("upd").hidden = false; }
$("updGo").addEventListener("click", () => { if (saveTimer) { clearTimeout(saveTimer); save(); } location.reload(); });
$("updX").addEventListener("click", () => { $("upd").hidden = true; });
function setupSW() {
  if (!("serviceWorker" in navigator)) return;
  UPD.had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (UPD.had) showUpdate(); UPD.had = true; });
  navigator.serviceWorker.register("sw.js").then(r => { UPD.reg = r; }).catch(() => { /* sw.js가 없으면 설치·오프라인만 빠지고 앱은 그대로 */ });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && UPD.reg) UPD.reg.update().catch(() => {}); });
}
if (location.protocol === "https:") setupSW();

/* ---------- 시작: 항상 이번 주 탭 ---------- */
switchTab("week");
</script>
